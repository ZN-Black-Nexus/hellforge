[workspace]
resolver = "3"
members = ["crates/hellforge", "crates/hellforge-rt", "games/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.88"
repository = "https://github.com/ZN-Black-Nexus/hellforge"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
incremental = false

[profile.dev]
panic = "abort"
opt-level = 1
